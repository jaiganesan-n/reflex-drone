# DroneDash levels (SPEC v2.3 §3). Planner caches hash this file.
#
# L1 is slow and sparse, L5 is dense. SPEC v2.3 (owner, 17 Oct 2026): L1 flies at 10 m/s and L2-L5
# at 12 m/s (was 8, 10, 12, 14, 16); from L2 on a level is harder by its obstacles (gaps, mix, combos,
# interruptions), not by its speed.
#
# speed:          scroll speed in m/s (constant within a fixed level; surges multiply it)
# mix:            relative weights of obstacle types (every type appears from L1). v2.0: real-life
#                 obstacles; trees replace mountains, street lights (pole) and kites added;
#                 drones/balloons (traffic) +20% on L1 and L2 only (owner, 16 Oct 2026). v2.1 (owner,
#                 17 Oct 2026): power lines and cranes removed, planes back with their v1.9 shares
#                 (0.05-0.09, high up), the other weights scaled to fill the rest
# gap_s:          time between obstacle starts, in seconds at the level's speed
#                 (never below game.yaml generator.min_gap_s = 0.9 s)
# combo_p:        chance that an obstacle comes as a combo: a second hazard at the same spot
#                 (bird, traffic or a plane over a building/tree, a storm dip over a building/tree,
#                 a downdraft over anything; never a plane in a storm; generator._PARTNERS). Both solvability checks still apply.
# gust_every_s / surge_every_s / fog_every_s: mean seconds between interruptions (0 = off)
# gust_accel:     gust strength range |a_wind| in m/s^2 (random sign)
# exclusive:      true = at most one interruption active at a time
# speed_mult:     multiplies the scroll speed (stress only)

levels:
  L1:
    speed: 10.0
    mix: {building: 0.216, tree: 0.162, pole: 0.065, kite: 0.054, storm: 0.097, bird: 0.13, traffic: 0.155, plane: 0.05, downdraft: 0.071}
    gap_s: [2.0, 3.2]
    combo_p: 0.0
    gust_every_s: 20.0
    gust_accel: [2.0, 4.0]
    surge_every_s: 45.0
    fog_every_s: 60.0
    exclusive: true
    speed_mult: 1.0
  L2:
    speed: 12.0
    mix: {building: 0.177, tree: 0.137, pole: 0.053, kite: 0.047, storm: 0.084, bird: 0.183, traffic: 0.203, plane: 0.06, downdraft: 0.056}
    gap_s: [1.6, 2.6]
    combo_p: 0.22
    gust_every_s: 12.0
    gust_accel: [3.0, 5.0]
    surge_every_s: 30.0
    fog_every_s: 45.0
    exclusive: true
    speed_mult: 1.0
  L3:
    speed: 12.0
    mix: {building: 0.166, tree: 0.125, pole: 0.052, kite: 0.047, storm: 0.078, bird: 0.218, traffic: 0.189, plane: 0.07, downdraft: 0.055}
    gap_s: [1.3, 2.1]
    combo_p: 0.42
    gust_every_s: 8.0
    gust_accel: [4.0, 6.0]
    surge_every_s: 22.0
    fog_every_s: 35.0
    exclusive: true
    speed_mult: 1.0
  L4:
    speed: 12.0
    mix: {building: 0.142, tree: 0.112, pole: 0.046, kite: 0.041, storm: 0.071, bird: 0.242, traffic: 0.213, plane: 0.08, downdraft: 0.053}
    gap_s: [1.1, 1.7]
    combo_p: 0.56
    gust_every_s: 6.0
    gust_accel: [4.0, 7.0]
    surge_every_s: 18.0
    fog_every_s: 30.0
    exclusive: true
    speed_mult: 1.0
  L5:
    speed: 12.0
    mix: {building: 0.123, tree: 0.099, pole: 0.04, kite: 0.035, storm: 0.065, bird: 0.269, traffic: 0.226, plane: 0.09, downdraft: 0.053}
    gap_s: [0.9, 1.4]
    combo_p: 0.7
    gust_every_s: 4.0
    gust_accel: [4.0, 8.0]
    surge_every_s: 15.0
    fog_every_s: 25.0
    exclusive: true
    speed_mult: 1.0
  stress:
    # Evaluation only, always on STRESS seeds. L5 with doubled interruption rates,
    # gust + fog + surge allowed at once, speed x 1.2.
    speed: 12.0
    mix: {building: 0.123, tree: 0.099, pole: 0.04, kite: 0.035, storm: 0.065, bird: 0.269, traffic: 0.226, plane: 0.09, downdraft: 0.053}
    gap_s: [0.9, 1.4]
    combo_p: 0.7
    gust_every_s: 2.0
    gust_accel: [4.0, 8.0]
    surge_every_s: 7.5
    fog_every_s: 12.5
    exclusive: false
    speed_mult: 1.2

# App default. The levels follow one another at equal distances over ramp_m metres (L2 from
# 1,750 m, L3 from 3,500 m, L4 from 5,250 m, L5 from 7,000 m), and the speed moves linearly from
# each level's speed to the next one's in between (SPEC v2.3: 10 -> 12 m/s over L1, then 12 m/s;
# before v2.3 the level followed the speed, 8 -> 16 m/s, which gave the same starts). There is no
# finish line.
#
# after_l5 ("L5+", SPEC v1.7): past ramp_m the speed stays at L5's speed and the obstacles get
# denser instead. For every km flown past the start of L5:
#   gap_s x (1 - gap_shrink_per_km * km), never below gap_floor_frac of L5's gap_s, never below
#   min_gap_s (the upper end stays >= the lower end + 0.2 s);
#   combo_p + combo_per_km * km, up to combo_max.
# The generator's two solvability checks still decide every obstacle: where nothing denser fits,
# it leaves a gap instead.
endless:
  sequence: [L1, L2, L3, L4, L5]
  ramp_m: 7000.0
  after_l5:
    gap_shrink_per_km: 0.05
    gap_floor_frac: 0.6
    min_gap_s: 0.6
    combo_per_km: 0.04
    combo_max: 0.8
